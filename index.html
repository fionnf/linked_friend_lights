<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report anything
       other than 0. Without it, the black-translucent status bar declared
       below has nothing to push content clear of, and on a notched iPhone the
       header sits under the clock once the page is added to the home screen. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Linked Lights</title>
  <meta name="theme-color" content="#060608">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #060608;
      --surface:   rgba(255,255,255,0.04);
      --surface2:  rgba(255,255,255,0.07);
      --surface3:  rgba(255,255,255,0.11);
      --border:    rgba(255,255,255,0.07);
      --border2:   rgba(255,255,255,0.13);
      --text:      #ebebf5;
      --text2:     #8888a8;
      --muted:     #44445a;
      --accent:    #f0a030;
      --accent2:   #e86820;
      --green:     #3ec46d;
      --red:       #e04848;
      --r:    16px;
      --r-sm: 11px;
      --r-xs: 8px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Insets resolve to 0 everywhere without a notch, so this is the same
         1.4rem / 1rem / 5rem as before on desktop and on Android. On a notched
         iPhone added to the home screen it is what keeps the header out from
         under the status bar and the last card off the home indicator. */
      padding: calc(1.4rem + env(safe-area-inset-top, 0px))
               calc(1rem + env(safe-area-inset-right, 0px))
               calc(5rem + env(safe-area-inset-bottom, 0px))
               calc(1rem + env(safe-area-inset-left, 0px));
      gap: 0.75rem;
    }

    /* ── Header ── */
    header {
      width: 100%; max-width: 580px;
      display: flex; justify-content: space-between; align-items: center;
    }
    h1 {
      font-size: 0.95rem; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase;
      background: linear-gradient(100deg, #ffffff 0%, var(--accent) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #header-right { display: flex; align-items: center; gap: 0.5rem; }
    #status { display: flex; align-items: center; gap: 0.3rem; font-size: 0.65rem; color: var(--muted); }
    #dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.4s, box-shadow 0.4s; }
    #dot.connected    { background: var(--green); box-shadow: 0 0 7px var(--green); }
    #dot.connecting   { background: var(--accent); box-shadow: 0 0 7px var(--accent); animation: pulse-dot 1s infinite; }
    #dot.disconnected { background: var(--red); }
    @keyframes pulse-dot { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    /* Board presence pills */
    #board-pills { display: flex; gap: 0.4rem; }
    .board-pill {
      display: flex; align-items: center; gap: 0.45rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-sm); padding: 0.35rem 0.7rem;
      transition: border-color 0.5s, background 0.5s;
    }
    .board-pill .pill-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
      background: var(--muted); transition: background 0.5s, box-shadow 0.5s;
    }
    .pill-info { display: flex; flex-direction: column; }
    .pill-label { font-size: 0.7rem; font-weight: 600; color: var(--text2); line-height: 1.3; }
    .pill-sub   { font-size: 0.57rem; color: var(--muted); line-height: 1.2; white-space: nowrap; max-width: 88px; overflow: hidden; text-overflow: ellipsis; }
    .board-pill.online { border-color: rgba(62,196,109,0.28); background: rgba(62,196,109,0.06); }
    .board-pill.online .pill-dot  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .board-pill.online .pill-label { color: var(--text); }
    .board-pill.online .pill-sub  { color: var(--green); }
    .board-pill.standby { border-color: rgba(240,160,48,0.22); background: rgba(240,160,48,0.04); }
    .board-pill.standby .pill-dot  { background: var(--accent); opacity: 0.6; }
    .board-pill.standby .pill-label { color: var(--text2); }
    .board-pill.standby .pill-sub  { color: var(--accent); opacity: 0.7; }

    /* ── Cards ── */
    .card {
      width: 100%; max-width: 580px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 1rem 1.1rem;
    }
    .card-title {
      font-size: 0.6rem; font-weight: 600; letter-spacing: 0.13em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 0.85rem;
    }

    /* ── Strip preview ── */
    #leds-row     { display: grid; gap: 3px; }
    #dividers-row { display: grid; gap: 3px; }
    .led {
      height: 50px; border-radius: 5px;
      transition: background 0.5s ease;
    }
    .led.boundary { box-shadow: inset -2px 0 0 rgba(255,255,255,0.12); }
    .div-cell {
      height: 18px; border-radius: 4px; background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.5rem; color: transparent;
      transition: background 0.15s; border: 1px solid transparent;
    }
    .div-cell:hover { background: rgba(255,255,255,0.05); border-color: var(--border2); }
    .div-cell.split { background: rgba(240,160,48,0.1); border-color: rgba(240,160,48,0.4); color: var(--accent); }

    /* ── Controls card ── */
    .ctrl-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-bottom: 0.75rem;
    }
    .power-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.3rem; padding: 1.1rem 0.5rem;
      border: 1px solid var(--border); border-radius: var(--r-sm);
      background: var(--surface2); color: var(--text2);
      font-family: inherit; cursor: pointer;
      transition: all 0.2s;
    }
    .power-btn .power-ring {
      width: 36px; height: 36px; border-radius: 50%;
      border: 2.5px solid var(--muted);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; transition: border-color 0.3s, box-shadow 0.3s;
    }
    .power-btn .power-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; }
    .power-btn.on  {
      background: rgba(62,196,109,0.08); border-color: rgba(62,196,109,0.3);
    }
    .power-btn.on .power-ring {
      border-color: var(--green); box-shadow: 0 0 14px rgba(62,196,109,0.4);
      color: var(--green);
    }
    .power-btn.on .power-label { color: var(--green); }
    .power-btn.off .power-ring { border-color: var(--red); color: var(--red); }
    .power-btn.off .power-label { color: var(--red); }

    .tap-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.3rem; padding: 1.1rem 0.5rem;
      border: none; border-radius: var(--r-sm);
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      color: rgba(0,0,0,0.85); font-family: inherit; cursor: pointer;
      transition: filter 0.15s, transform 0.1s; position: relative; overflow: hidden;
    }
    .tap-btn .tap-icon { font-size: 1.4rem; line-height: 1; }
    .tap-btn .tap-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; }
    .tap-btn:hover { filter: brightness(1.08); }
    .tap-btn:active { transform: scale(0.96); }
    .tap-btn::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.25) 0%, transparent 60%);
      opacity: 0; transition: opacity 0.3s;
    }
    .tap-btn:active::after { opacity: 1; }

    .ctrl-secondary {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 0.85rem;
    }
    .ctrl-pill {
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      /* 44px floor: these measured 37px, under Apple's minimum target, and
         they are the main mode switches on a phone-sized screen. */
      padding: 0.65rem 0.5rem;
      min-height: 44px;
      border: 1px solid var(--border); border-radius: var(--r-sm);
      background: transparent; color: var(--text2);
      font-family: inherit; font-size: 0.78rem; font-weight: 500; cursor: pointer;
      transition: all 0.18s;
    }
    .ctrl-pill:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); }
    .ctrl-pill .pill-icon { font-size: 0.9rem; }
    .ctrl-pill.active { background: rgba(240,160,48,0.1); border-color: rgba(240,160,48,0.4); color: var(--accent); }
    .ctrl-pill:disabled { opacity: 0.25; pointer-events: none; }

    /* ── Sliders ── */
    .sl-row {
      display: flex; align-items: center; gap: 0.7rem;
      margin-bottom: 0.55rem;
    }
    .sl-row:last-child { margin-bottom: 0; }
    .sl-label { font-size: 0.68rem; color: var(--text2); width: 80px; flex-shrink: 0; }
    .sl-val   { font-size: 0.68rem; color: var(--text2); width: 40px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    input[type=range] {
      flex: 1; -webkit-appearance: none; height: 5px;
      border-radius: 3px; outline: none; cursor: pointer;
      background: rgba(255,255,255,0.1);
    }
    input[type=range]::-webkit-slider-thumb {
      /* 44x44 of grabbable area, 20x20 of visible dot. The transparent border
         is the target; background-clip keeps the white inside the content box.
         Done on the thumb rather than the input because several of these
         sliders set `background:` inline, and that shorthand resets
         background-clip — padding the input itself painted the track as a
         45px slab. The thumb has no such conflict. */
      -webkit-appearance: none;
      width: 44px; height: 44px;
      border: 12px solid transparent;
      background-clip: content-box;
      border-radius: 50%; background-color: #fff;
      /* drop-shadow, not box-shadow: box-shadow follows the 44px border box,
         so the depth shadow spread into a visible haze either side of the
         20px dot. A filter follows the shape actually painted. */
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.55));
      cursor: pointer; transition: transform 0.1s, filter 0.15s;
    }
    input[type=range]::-webkit-slider-thumb:active {
      transform: scale(1.25);
      filter: drop-shadow(0 2px 5px rgba(240,160,48,0.75));
    }

    /* ── Palette bar ── */
    #palette-bar-wrap {
      position: relative; height: 50px; margin-bottom: 1rem; user-select: none;
    }
    #palette-bar {
      position: absolute; left: 13px; right: 13px; top: 50%; height: 16px;
      transform: translateY(-50%); border-radius: 8px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.5);
    }
    .g-handle {
      position: absolute; top: 50%; width: 30px; height: 30px;
      border-radius: 50%; transform: translate(-50%, -50%);
      border: 2.5px solid rgba(255,255,255,0.85);
      box-shadow: 0 3px 12px rgba(0,0,0,0.65);
      cursor: grab; display: flex; align-items: center; justify-content: center;
      font-size: 0.58rem; font-weight: 700; color: rgba(0,0,0,0.6);
      transition: transform 0.15s, box-shadow 0.15s; z-index: 2;
    }
    .g-handle:hover { transform: translate(-50%, -62%); box-shadow: 0 6px 18px rgba(0,0,0,0.7); }
    .g-handle:active { cursor: grabbing; z-index: 3; }

    /* ── Group panels ── */
    #group-panels { display: flex; flex-direction: column; gap: 0.4rem; }
    .group-panel {
      background: rgba(0,0,0,0.18); border: 1px solid var(--border);
      border-radius: var(--r-sm); padding: 0.6rem 0.85rem;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .g-swatch {
      width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
      transition: background 0.5s ease; border: 1px solid rgba(255,255,255,0.07);
    }
    .g-title { font-size: 0.73rem; font-weight: 600; color: var(--text); }
    .g-sub   { font-size: 0.6rem; color: var(--muted); }

    /* ── Library (presets + scenes) ── */

    /* Scene / preset rows */
    .scene-grid {
      display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.75rem;
    }
    .scene-row {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.6rem 0.75rem;
      background: rgba(0,0,0,0.18); border: 1px solid var(--border);
      border-radius: var(--r-xs);
      transition: border-color 0.15s, background 0.15s; cursor: default;
    }
    .scene-row:hover { border-color: var(--border2); background: var(--surface2); }
    .scene-swatches { display: flex; gap: 3px; flex-shrink: 0; }
    .scene-dot { width: 11px; height: 11px; border-radius: 50%; }
    .scene-name {
      flex: 1; font-size: 0.8rem; font-weight: 500; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .scene-load {
      padding: 0.32rem 0.7rem; font-size: 0.72rem; font-weight: 500;
      border-radius: var(--r-xs); border: 1px solid var(--border);
      background: transparent; color: var(--text2); cursor: pointer;
      flex-shrink: 0; font-family: inherit;
      transition: border-color 0.15s, color 0.15s;
    }
    .scene-load:hover { border-color: var(--border2); color: var(--text); }
    .scene-del {
      padding: 0.32rem 0.5rem; font-size: 0.72rem;
      border-radius: var(--r-xs); border: 1px solid transparent;
      background: transparent; color: var(--muted); cursor: pointer;
      flex-shrink: 0; font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
    }
    .scene-del:hover { color: var(--red); border-color: rgba(224,72,72,0.3); }
    .save-row { display: flex; gap: 0.5rem; }
    .save-row input {
      flex: 1; min-height: 44px; background: rgba(0,0,0,0.25); border: 1px solid var(--border);
      border-radius: var(--r-xs); color: var(--text); font-family: inherit; font-size: 0.8rem;
      padding: 0.55rem 0.75rem; outline: none; transition: border-color 0.2s;
    }
    .save-row input:focus { border-color: rgba(240,160,48,0.45); }
    .save-row input::placeholder { color: var(--muted); }
    .save-row button {
      min-height: 44px;
      flex-shrink: 0; padding: 0.55rem 1rem; font-size: 0.8rem;
      border: 1px solid var(--border); border-radius: var(--r-xs);
      background: var(--surface2); color: var(--text2);
      font-family: inherit; cursor: pointer; font-weight: 500;
      transition: all 0.15s;
    }
    .save-row button:hover { border-color: var(--border2); color: var(--text); }
    .no-scenes { font-size: 0.72rem; color: var(--muted); text-align: center; padding: 0.85rem 0; }

    /* ── Sunrise alarms ── */
    .alarm-card {
      background: rgba(0,0,0,0.18); border: 1px solid var(--border);
      border-radius: var(--r-sm); padding: 0.85rem 0.95rem; margin-bottom: 0.5rem;
    }
    .alarm-header { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.6rem; }
    .alarm-toggle {
      width: 38px; height: 21px; border-radius: 11px; border: none;
      background: rgba(255,255,255,0.1); cursor: pointer; position: relative;
      transition: background 0.25s; flex-shrink: 0;
    }
    .alarm-toggle::after {
      content: ""; position: absolute; width: 15px; height: 15px;
      background: #fff; border-radius: 50%; top: 3px; left: 3px;
      transition: left 0.25s; box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    .alarm-toggle.on { background: rgba(62,196,109,0.5); }
    .alarm-toggle.on::after { left: 20px; }
    .alarm-time {
      font-size: 1.2rem; font-weight: 600; color: var(--text);
      background: none; border: none; border-bottom: 1px solid var(--border);
      width: 84px; outline: none; text-align: center; font-family: inherit;
      transition: border-color 0.2s;
    }
    .alarm-time:focus { border-color: var(--accent); }
    .alarm-days { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .alarm-boards { display: flex; gap: 6px; margin-bottom: 0.55rem; }
    .board-btn {
      padding: 0.25rem 0.65rem; border-radius: var(--r-xs);
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); font-family: inherit; font-size: 0.68rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .board-btn:hover { border-color: var(--border2); color: var(--text2); }
    .board-btn.on { background: rgba(240,160,48,0.13); border-color: rgba(240,160,48,0.45); color: var(--accent); }
    .day-btn {
      width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); font-family: inherit; font-size: 0.63rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    .day-btn:hover { border-color: var(--border2); color: var(--text2); }
    .day-btn.on { background: rgba(240,160,48,0.14); border-color: rgba(240,160,48,0.45); color: var(--accent); }
    .alarm-type-btn {
      font-size: 0.68rem; font-weight: 600; cursor: pointer; padding: 0.2rem 0.5rem;
      border-radius: var(--r-xs); border: 1px solid var(--border); background: none;
      color: var(--text2); transition: background 0.15s, border-color 0.15s; white-space: nowrap;
    }
    .alarm-type-btn.sunrise { border-color: rgba(240,160,48,0.4); color: var(--accent); }
    .alarm-type-btn.sunset  { border-color: rgba(100,100,200,0.4); color: #9090e0; }
    .alarm-del {
      margin-left: auto; background: none; border: none; color: var(--muted);
      font-size: 0.95rem; cursor: pointer; padding: 0.2rem 0.4rem;
      flex: none; transition: color 0.15s;
    }
    .alarm-del:hover { color: var(--red); }
    .add-alarm-btn {
      width: 100%; margin-top: 0.3rem; padding: 0.7rem; min-height: 44px;
      border: 1px dashed var(--border); border-radius: var(--r-sm);
      background: transparent; color: var(--muted);
      font-family: inherit; font-size: 0.78rem; cursor: pointer;
      transition: all 0.2s;
    }
    .add-alarm-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(240,160,48,0.04); }
    #alarm-warning {
      display: none; font-size: 0.7rem; line-height: 1.4;
      color: #ffcf8a; background: rgba(240,160,48,0.09);
      border: 1px solid rgba(240,160,48,0.3); border-radius: var(--r-xs);
      padding: 0.55rem 0.7rem; margin-bottom: 0.6rem;
    }

    /* ── Settings ── */
    #cfg-toggle {
      min-height: 44px;
      background: transparent; border: 1px solid var(--border);
      border-radius: 20px; color: var(--muted);
      font-family: inherit; font-size: 0.65rem; font-weight: 600;
      cursor: pointer; letter-spacing: 0.09em; text-transform: uppercase;
      padding: 0.35rem 0.9rem;
      transition: all 0.2s; align-self: center;
    }
    #cfg-toggle:hover { border-color: var(--border2); color: var(--text2); background: var(--surface2); }
    #cfg-panel { display: none; flex-direction: column; gap: 0.6rem; }
    #cfg-panel.open { display: flex; }
    .cfg-field { display: flex; flex-direction: column; gap: 0.28rem; }
    .cfg-field label { font-size: 0.62rem; font-weight: 600; color: var(--muted); letter-spacing: 0.09em; text-transform: uppercase; }
    .cfg-field input {
      background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      border-radius: var(--r-xs); color: var(--text); font-family: inherit; font-size: 0.84rem;
      padding: 0.52rem 0.7rem; outline: none; transition: border-color 0.2s;
    }
    .cfg-field input:focus { border-color: rgba(240,160,48,0.45); }
    .cfg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
    .cfg-btn {
      padding: 0.65rem; border: 1px solid var(--border); border-radius: var(--r-xs);
      background: var(--surface2); color: var(--text2);
      font-family: inherit; font-size: 0.8rem; font-weight: 500; cursor: pointer;
      transition: all 0.15s;
    }
    .cfg-btn:hover { border-color: var(--border2); color: var(--text); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <h1>Linked Lights</h1>
  <div id="header-right">
    <div id="board-pills">
      <div class="board-pill" id="pill-a">
        <div class="pill-dot"></div>
        <div class="pill-info">
          <span class="pill-label" id="pill-a-label">A</span>
          <span class="pill-sub"  id="pill-a-sub">offline</span>
        </div>
      </div>
      <div class="board-pill" id="pill-b">
        <div class="pill-dot"></div>
        <div class="pill-info">
          <span class="pill-label" id="pill-b-label">B</span>
          <span class="pill-sub"  id="pill-b-sub">offline</span>
        </div>
      </div>
    </div>
    <div id="status"><div id="dot" class="disconnected"></div><span id="status-text">disconnected</span></div>
  </div>
</header>

<!-- Strip preview -->
<div class="card">

<script>
// ── Config ────────────────────────────────────────────────
let cfg = {
  broker:    localStorage.getItem("ll_broker")    || "wss://broker.hivemq.com:8884/mqtt",
  prefix:    localStorage.getItem("ll_prefix")    || "picolight_lf26",
  numLeds:   parseInt(localStorage.getItem("ll_leds")   || "10"),
  numGroups: parseInt(localStorage.getItem("ll_groups") || "3"),
  boardIdA:  "board_a",
  boardNameA:"FF",
  boardIdB:  "board_b",
  boardNameB:"LS",
};
document.getElementById("cfg-broker").value  = cfg.broker;
document.getElementById("cfg-prefix").value  = cfg.prefix;
document.getElementById("cfg-leds").value    = cfg.numLeds;
document.getElementById("cfg-groups").value  = cfg.numGroups;

// ── Palette ─────────────────────────────────────────────────
const PALETTE = [
  [255,200,80],[255,160,0],[255,120,0],[255,60,0],
  [255,0,0],[255,0,60],[255,0,140],[200,0,200],
  [140,0,255],[80,0,255],[0,0,255],[0,60,255],
  [0,140,255],[0,200,255],[0,255,220],[0,255,160],
  [0,255,80],[0,220,0],[80,255,0],[160,255,0],
  [220,255,0],[255,240,0],[255,180,40],[255,100,80],
  [255,80,160],[180,40,255],[40,100,255],[0,180,180],
  [20,255,120],[255,220,120],
];
const BASE_W = [0,0,0,200];

function lerp(a,b,t) { return a+(b-a)*t; }

function paletteRGB(pos) {
  const n = PALETTE.length;
  const scaled = Math.min(pos, 0.9999) * (n-1);
  const idx  = Math.floor(scaled);
  const frac = scaled - idx;
  const c1 = PALETTE[idx], c2 = PALETTE[Math.min(idx+1,n-1)];
  const tint = [0,1,2].map(i => lerp(c1[i],c2[i],frac));
  const sat = pos;
  const r = Math.round(lerp(BASE_W[0],tint[0],sat));
  const g = Math.round(lerp(BASE_W[1],tint[1],sat));
  const b = Math.round(lerp(BASE_W[2],tint[2],sat));
  const w = Math.round(BASE_W[3]*(1-sat));
  return [Math.min(255,r+w), Math.min(255,g+Math.round(w*0.8)), Math.min(255,b+Math.round(w*0.6))];
}

function rgbStr(pos) {
  const [r,g,b] = paletteRGB(pos);
  return `rgb(${r},${g},${b})`;
}

function paletteGradient() {
  const stops = [];
  const steps = 24;
  for (let i = 0; i <= steps; i++) {
    const pos = i / steps;
    const [r,g,b] = paletteRGB(pos);
    stops.push(`rgb(${r},${g},${b}) ${Math.round(pos*100)}%`);
  }
  return `linear-gradient(to right, ${stops.join(", ")})`;
}
const COLOUR_GRADIENT = paletteGradient();

// ── State ───────────────────────────────────────────────────
let boundaries     = new Set();
let groupPositions = [];
let groupWLevels   = [];
let powered        = true;
let brightness     = 0.6;
let fadeSteps      = 60;
const driftEnabled   = false;
const driftInterval  = 45;
const BOARD_ID     = "web_app";
const boardLastSeen   = {};
const boardOnline     = {};   // broker-tracked presence via retained Last-Will (true/false/undefined)
const boardNtp        = {};   // clock synced? alarms cannot fire without it
const boardLastChange = {};
const boardLastFw     = {};   // firmware version per board
const boardLastPower  = {};   // last known on/off state per board
let _rebootWatchTimer = null; // pending "did any board answer the reboot?" check
const PING_INTERVAL_MS  = 120_000; // active presence poll every 2 min
const BOARD_TIMEOUT_MS  = 150_000; // 2.5× ping interval before marking offline
let alarms      = [];
let sendTarget  = "both";  // "both" | cfg.boardIdA | cfg.boardIdB

// Board pill "last known state" description
function boardStateDesc(d) {
  if (d.heartbeat) return "online";
  if (d.on === false) return "lights off";
  if (d.on === true)  return "lights on";
  if (d.groups) return "colours changed";
  if (d.brightness !== undefined) return `${Math.round(d.brightness*100)}% bright`;
  return "updated";
}

const _pillState   = {};   // last known state string per pill — avoid spurious DOM thrash
const _boardTimers = {};   // per-board timeout handle for offline detection

function updatePills() {
  [
    ["pill-a", "pill-a-label", "pill-a-sub", cfg.boardIdA, cfg.boardNameA],
    ["pill-b", "pill-b-label", "pill-b-sub", cfg.boardIdB, cfg.boardNameB],
  ].forEach(([pillId, labelId, subId, boardId, name]) => {
    const pill = document.getElementById(pillId);
    if (!pill) return;
    const labelEl = document.getElementById(labelId);
    if (labelEl.textContent !== name) labelEl.textContent = name;

    const seen  = boardLastSeen[boardId];
    const fresh = !!(seen && (Date.now() - seen) < BOARD_TIMEOUT_MS);
    // Broker-tracked Last-Will is authoritative: false → offline now,
    // true → online; undefined (no retained status yet) → fall back to freshness.
    // And if the web app itself is disconnected, we can't know — show offline.
    const mqttUp = !!(client && client.connected);
    const st = boardOnline[boardId];
    const reachable = mqttUp && (st === false ? false : (st === true || fresh));
    const lightsOn  = boardLastPower[boardId] !== false; // default true if unknown
    // three states: "online" (reachable + on), "standby" (reachable + off), "" (offline)
    const state = reachable ? (lightsOn ? "online" : "standby") : "";

    if (_pillState[pillId] !== state) {
      _pillState[pillId] = state;
      pill.classList.toggle("online",  state === "online");
      pill.classList.toggle("standby", state === "standby");
    }
    const sub = document.getElementById(subId);
    const extra    = boardLastFw[boardId]   ? ` · fw ${boardLastFw[boardId]}`   : "";
    const subText  = reachable
      ? ((boardLastChange[boardId] || "online") + extra)
      : "offline";
    if (sub.textContent !== subText) sub.textContent = subText;
  });
  updateAlarmWarning();
}

// Alarms are compared against the board's clock, so a board that never
// synced NTP can't fire them. Say so instead of failing silently.
function updateAlarmWarning() {
  const el = document.getElementById("alarm-warning");
  if (!el) return;
  const bad = [[cfg.boardIdA, cfg.boardNameA], [cfg.boardIdB, cfg.boardNameB]]
    .filter(([id]) => boardNtp[id] === false)
    .map(([, name]) => name);
  if (bad.length) {
    el.textContent = `⚠ ${bad.join(" & ")} ${bad.length > 1 ? "have" : "has"} no clock `
      + `(NTP sync failed) — alarms can't fire until it syncs. It retries hourly; `
      + `a reboot usually fixes it.`;
    el.style.display = "block";
  } else {
    el.style.display = "none";
  }
}

// Schedule a one-shot pill refresh exactly when a board's timeout expires.
// Cancels any previous timer for that board so we don't stack them.
function _scheduleBoardTimeout(boardId) {
  clearTimeout(_boardTimers[boardId]);
  _boardTimers[boardId] = setTimeout(updatePills, BOARD_TIMEOUT_MS + 200);
}

function initGroups(n) {
  boundaries.clear();
  const size = Math.floor(cfg.numLeds / n);
  for (let i = 1; i < n; i++) boundaries.add(i * size);
  groupPositions = Array.from({length: n}, () => 0.0);
  groupWLevels   = Array.from({length: n}, () => 1.0);
}

function getGroups() {
  const splits = [0, ...Array.from(boundaries).sort((a,b)=>a-b), cfg.numLeds];
  return splits.slice(0,-1).map((start,i) => ({
    pos:  groupPositions[i] ?? 0,
    w:    groupWLevels[i]   ?? 1.0,
    size: splits[i+1] - start,
  }));
}

function groupCount() { return boundaries.size + 1; }

// ── MQTT ──────────────────────────────────────────────────────
let client = null;
let _pingIntervalId = null;

function topic()       { return cfg.prefix + "/events"; }
function topicAlarms() { return cfg.prefix + "/alarms"; }
function topicScenes() { return cfg.prefix + "/scenes"; }
function topicStatus() { return cfg.prefix + "/status/+"; }

function setStatus(cls, text) {
  document.getElementById("dot").className = cls;
  document.getElementById("status-text").textContent = text;
  const ok = cls === "connected";
  ["btn-tap","btn-power","btn-reset"].forEach(id => {
    document.getElementById(id).disabled = !ok;
  });
}

function connect() {
  if (_pingIntervalId) { clearInterval(_pingIntervalId); _pingIntervalId = null; }
  if (client) { try { client.end(true); } catch(e) {} }
  setStatus("connecting", "connecting…");
  client = mqtt.connect(cfg.broker, { clientId: "webui_"+Math.random().toString(16).slice(2), clean: true });
  client.on("connect", () => {
    setStatus("connected", cfg.broker.replace(/^wss?:\/\//,"").replace(/\/mqtt$/,""));
    client.subscribe(topic());
    client.subscribe(topicAlarms());
    client.subscribe(topicScenes());  // retained — shared scene library
    client.subscribe(topicStatus());  // retained — pills light up immediately
    // Ping boards immediately so they echo their state back (pills update fast)
    setTimeout(() => publish({ ping: true }), 300);
    // Then keep polling every 2 min so pills stay current without relying on board heartbeats
    _pingIntervalId = setInterval(() => publish({ ping: true }), PING_INTERVAL_MS);
    // Share our scene library. Delayed so the retained copy lands first and
    // we publish the merge of both, rather than overwriting it with ours.
    setTimeout(() => { if (loadScenes().length) publishScenes(); }, 1200);
  });
  client.on("message", (t, msg) => {
    const topicStr = t.toString();
    try {
      const d = JSON.parse(msg.toString());

      if (topicStr.startsWith(cfg.prefix + "/status/")) {
        const id = topicStr.split("/").pop();
        boardOnline[id] = !!d.online;
        if (d.fw) boardLastFw[id] = d.fw;
        if (d.ntp !== undefined) boardNtp[id] = d.ntp;
        if (d.online) { boardLastSeen[id] = Date.now(); _scheduleBoardTimeout(id); }
        updatePills();
        return;
      }

      if (topicStr === topicScenes()) {
        if (d.from === BOARD_ID) return;          // our own retained copy
        if (mergeScenes(d)) {
          renderScenes();
          publishScenes();                        // share the merged result
          showToast("Scenes synced");
        }
        return;
      }

      if (topicStr === topicAlarms()) {
        if (Array.isArray(d)) {
          alarms = d;
          // Self-heal DST shifts / legacy UTC-only alarms, then republish
          if (normaliseAlarms()) publishAlarms();
          renderAlarms();
        }
        return;
      }

      if (d.from) {
        boardLastSeen[d.from] = Date.now();
        boardLastChange[d.from] = boardStateDesc(d);
        if (d.fw)  boardLastFw[d.from]  = d.fw;
        if (d.ntp !== undefined) boardNtp[d.from] = d.ntp;
        if (d.on !== undefined) boardLastPower[d.from] = d.on;
        updatePills();
        _scheduleBoardTimeout(d.from);
      }
      if (d.rebooting && d.from && d.from.startsWith("board_")) {
        showToast("\u21ba " + d.from + " is rebooting \u2014 back in ~30 s");
        if (_rebootWatchTimer) { clearTimeout(_rebootWatchTimer); _rebootWatchTimer = null; }
      }
      if (d.from === BOARD_ID) return;
      if (Date.now() < _holdUntil) return;  // user is mid-interaction — don't yank controls
      if (d.on         !== undefined) { powered = d.on;              updatePowerBtn(); }
      if (d.brightness !== undefined) { brightness = d.brightness;   syncBrightnessSlider(); }
      if (d.fade_steps !== undefined) { fadeSteps = d.fade_steps;    syncFadeSlider(); }
      if (d.groups) {
        groupPositions = d.groups.map(x => x.pos);
        groupWLevels   = d.groups.map(x => x.w);
        boundaries.clear();
        let cursor = 0;
        d.groups.slice(0,-1).forEach(g => {
          cursor += g.size;
          if (cursor > 0 && cursor < cfg.numLeds) boundaries.add(cursor);
        });
        renderAll();
      }
    } catch(e) { console.warn("[mqtt] bad message on", topicStr, e); }
  });
  client.on("error",     () => setStatus("disconnected", "error"));
  client.on("close",     () => {
    setStatus("disconnected", "disconnected");
    if (_pingIntervalId) { clearInterval(_pingIntervalId); _pingIntervalId = null; }
    updatePills();   // don't keep showing stale green pills with no connection
  });
  client.on("reconnect", () => setStatus("connecting",   "reconnecting…"));
}

// Phones suspend the WebSocket when the tab is backgrounded; on return the
// app would sit on a dead socket until mqtt.js noticed. Reconnect (or
// refresh state) the moment the tab becomes visible again.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (!client || !client.connected) connect();
  else publish({ ping: true });
  updatePills();
});

// ── Debounce helper ────────────────────────────────────────────
function debounce(fn, ms) {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };
}

// While the user is actively adjusting a control, ignore incoming state
// echoes — otherwise the round-trip echo yanks the slider/handle they are
// still holding. Refreshed on every local interaction, expires after 1.5 s.
let _holdUntil = 0;
function markLocalInteraction() { _holdUntil = Date.now() + 1500; }

let _publishFlashTimer = null;
function _flashDot() {
  const dot = document.getElementById("dot");
  dot.style.opacity = "0.3";
  clearTimeout(_publishFlashTimer);
  _publishFlashTimer = setTimeout(() => { dot.style.opacity = ""; }, 200);
}

function showToast(msg) {
  let t = document.getElementById("ll-toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "ll-toast";
    t.style.cssText = "position:fixed;bottom:calc(1.5rem + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);background:rgba(30,30,40,0.95);color:#fff;padding:.5rem 1.2rem;border-radius:2rem;font-size:.85rem;z-index:9999;pointer-events:none;transition:opacity .3s";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = "0"; }, 2500);
}

let _offlineToastAt = 0;
function publish(payload) {
  if (!client || !client.connected) {
    // Silently dropping the change made the app feel broken — say so instead
    if (Date.now() - _offlineToastAt > 3000) {
      _offlineToastAt = Date.now();
      showToast("⚠ Not connected — change not sent");
    }
    return;
  }
  payload.from = BOARD_ID;
  if (sendTarget !== "both") payload.target = sendTarget;
  // Mirror on/off state immediately so pills update without waiting for echo
  if (payload.on !== undefined) {
    const targets = sendTarget === "both"
      ? [cfg.boardIdA, cfg.boardIdB]
      : [sendTarget];
    targets.forEach(id => { boardLastPower[id] = payload.on; });
    updatePills();
  }
  client.publish(topic(), JSON.stringify(payload));
  _flashDot();
}

function updateTargetBtns() {
  document.getElementById("btn-target-both").classList.toggle("active", sendTarget === "both");
  document.getElementById("btn-target-a").classList.toggle("active",    sendTarget === cfg.boardIdA);
  document.getElementById("btn-target-b").classList.toggle("active",    sendTarget === cfg.boardIdB);
  document.getElementById("btn-target-a").textContent = cfg.boardNameA;
  document.getElementById("btn-target-b").textContent = cfg.boardNameB;
}
document.getElementById("btn-target-both").addEventListener("click", () => { sendTarget = "both";        updateTargetBtns(); });
document.getElementById("btn-target-a").addEventListener("click",    () => { sendTarget = cfg.boardIdA;  updateTargetBtns(); });
document.getElementById("btn-target-b").addEventListener("click",    () => { sendTarget = cfg.boardIdB;  updateTargetBtns(); });

function publishRetained(topicFn, payload) {
  if (!client || !client.connected) return;
  client.publish(topicFn(), JSON.stringify(payload), { retain: true, qos: 1 });
}

// Alarms and reboots must reach BOTH boards regardless of the "Send to"
// selector — an alarm's own `boards` field decides which lamp acts on it.
function publishBroadcast(payload) {
  if (!client || !client.connected) {
    showToast("⚠ Not connected — not saved to the lamps");
    return;
  }
  payload.from = BOARD_ID;
  client.publish(topic(), JSON.stringify(payload));
  _flashDot();
}

function publishState() {
  markLocalInteraction();
  const p = { groups: getGroups(), on: powered, brightness, fade_steps: fadeSteps,
              drift_enabled: driftEnabled, drift_interval: driftInterval };
  publish(p);
}


// ── Random ────────────────────────────────────────────────────
function randFloat(lo,hi) { return lo + Math.random()*(hi-lo); }

function randomPartition(total, n, mn, mx) {
  const sizes = []; let rem = total;
  for (let i = 0; i < n; i++) {
    const left = n-i;
    const lo = Math.max(mn, rem-left*mx);
    const hi = Math.min(mx, rem-(left-1)*mn);
    let s = Math.round(randFloat(lo, hi));
    s = Math.max(mn, Math.min(mx, s));
    sizes.push(s); rem -= s;
  }
  sizes[sizes.length-1] += rem;
  return sizes;
}

function randomise() {
  const n = groupCount();
  const sizes = randomPartition(cfg.numLeds, n, 1, 8);
  boundaries.clear();
  let cursor = 0;
  sizes.slice(0,-1).forEach(s => { cursor += s; boundaries.add(cursor); });
  groupPositions = Array.from({length: n}, () => randFloat(0,1));
  groupWLevels   = Array.from({length: n}, () => randFloat(0.6,1.0));
}

// ── Rendering ───────────────────────────────────────────────────
function renderStrip() {
  const cols = `repeat(${cfg.numLeds}, 1fr)`;
  const ledsRow = document.getElementById("leds-row");
  const divRow  = document.getElementById("dividers-row");
  ledsRow.innerHTML = "";
  divRow.innerHTML  = "";
  ledsRow.style.gridTemplateColumns = cols;
  divRow.style.gridTemplateColumns  = cols;
  const groups = getGroups();
  let ledIdx = 0;
  groups.forEach(g => {
    for (let j = 0; j < g.size; j++) {
      const el = document.createElement("div");
      el.className = "led";
      el.style.background = powered ? rgbStr(g.pos) : "#111";
      if (j === g.size-1 && ledIdx < cfg.numLeds-1) el.classList.add("boundary");
      ledsRow.appendChild(el);
      ledIdx++;
    }
  });
  for (let i = 0; i < cfg.numLeds; i++) {
    const el = document.createElement("div");
    el.className = "div-cell" + (boundaries.has(i) ? " split" : "");
    el.textContent = boundaries.has(i) ? "┃" : "";
    if (i > 0) {
      el.addEventListener("click", () => {
        if (boundaries.has(i)) boundaries.delete(i); else boundaries.add(i);
        rebuildGroupData(); renderAll(); publishState();
      });
    }
    divRow.appendChild(el);
  }
}

// Recolour existing LED cells without rebuilding the DOM — used on the
// drag hot path where innerHTML rebuilds at 60 Hz cause visible jank.
function updateStripColours() {
  const ledsRow = document.getElementById("leds-row");
  if (ledsRow.children.length !== cfg.numLeds) { renderStrip(); return; }
  let idx = 0;
  getGroups().forEach(g => {
    const colour = powered ? rgbStr(g.pos) : "#111";
    for (let j = 0; j < g.size; j++) ledsRow.children[idx++].style.background = colour;
  });
}

function rebuildGroupData() {
  const n = groupCount();
  while (groupPositions.length < n) groupPositions.push(randFloat(0,1));
  while (groupWLevels.length   < n) groupWLevels.push(randFloat(0.6,1.0));
  groupPositions = groupPositions.slice(0, n);
  groupWLevels   = groupWLevels.slice(0, n);
}

// ── Palette drag — single document listener, no per-render leaks ──
let _paletteDragging = -1;   // index of handle being dragged, -1 = none
const _publishPalette = debounce(publishState, 120);

function _palettePos(e, bar) {
  const rect = bar.getBoundingClientRect();
  return Math.max(0, Math.min(1, ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) / rect.width));
}
(function _initPaletteListeners() {
  function onMove(e) {
    if (_paletteDragging < 0) return;
    e.preventDefault();
    const bar = document.getElementById("palette-bar");
    const pos = _palettePos(e, bar);
    const i   = _paletteDragging;
    groupPositions[i] = pos;
    const [r,gb,b] = paletteRGB(pos);
    const handle = document.getElementById(`gh-${i}`);
    if (handle) {
      handle.style.background = `rgb(${r},${gb},${b})`;
      handle.style.left = `calc(12px + ${pos} * (100% - 24px))`;
    }
    const sw = document.getElementById(`gsw-${i}`);
    if (sw) sw.style.background = rgbStr(pos);
    markLocalInteraction();
    updateStripColours(); _publishPalette();
  }
  document.addEventListener("mousemove",  onMove);
  document.addEventListener("touchmove",  onMove, { passive: false });
  document.addEventListener("mouseup",    () => { _paletteDragging = -1; });
  document.addEventListener("touchend",   () => { _paletteDragging = -1; });
})();

function renderPaletteBar() {
  const wrap = document.getElementById("palette-bar-wrap");
  const bar  = document.getElementById("palette-bar");
  bar.style.background = COLOUR_GRADIENT;
  wrap.querySelectorAll(".g-handle").forEach(h => h.remove());
  const groups = getGroups();

    handle.style.left = `calc(12px + ${g.pos} * (100% - 24px))`;
    handle.addEventListener("mousedown",  e => { _paletteDragging = i; e.preventDefault(); });
    handle.addEventListener("touchstart", () => { _paletteDragging = i; }, { passive: true });
    wrap.appendChild(handle);
  });
}

  // confirm-gated version simply did nothing when tapped from the
  // installed app. Arming the button with a second tap needs no dialog,
  // and every outcome — sent, not connected, no reply — lands as a

    if (_rebootWatchTimer) clearTimeout(_rebootWatchTimer);

// ── Alarms ──────────────────────────────────────────────────────
const DAY_LABELS = ["Mo","Tu","We","Th","Fr","Sa","Su"];

// ── Timezone ──
// The Pico has no timezone database, so firmware compares alarms against
// UTC. The UI therefore edits in LOCAL time and records the user's intent
// in lh/lm, which lets the UTC fields be recomputed whenever the offset
// changes — so an alarm set to 07:00 stays 07:00 across a DST switch.
function localToUtc(lh, lm) {
  const d = new Date(); d.setHours(lh, lm, 0, 0);
  return [d.getUTCHours(), d.getUTCMinutes()];
}
function utcToLocal(uh, um) {
  const d = new Date(); d.setUTCHours(uh, um, 0, 0);
  return [d.getHours(), d.getMinutes()];
}
function alarmLocal(a) {
  if (Number.isInteger(a.lh) && Number.isInteger(a.lm)) return [a.lh, a.lm];
  return utcToLocal(a.hour || 0, a.minute || 0);   // legacy alarm: derive intent
}
// Re-derive the UTC fields from local intent. Returns true if anything
// changed (DST shift, or a legacy alarm gaining lh/lm) → caller republishes.
function normaliseAlarms() {
  let changed = false;
  alarms.forEach(a => {
    const [lh, lm] = alarmLocal(a);
    if (a.lh !== lh || a.lm !== lm) { a.lh = lh; a.lm = lm; changed = true; }
    const [uh, um] = localToUtc(lh, lm);
    if (a.hour !== uh || a.minute !== um) { a.hour = uh; a.minute = um; changed = true; }
  });
  return changed;
}

function defaultAlarm() {
  const [uh, um] = localToUtc(7, 0);
  return { enabled: true, type: "sunrise", hour: uh, minute: um, lh: 7, lm: 0,
           duration_min: 30, brightness: 1.0, days: [0,1,2,3,4],
           boards: [cfg.boardIdA, cfg.boardIdB] };
}

function publishAlarms() {
  // Retained → durable: a board that is offline now still gets the schedule
  // when it reconnects. The events copy is just the instant path for boards
  // that are already online.
  publishRetained(topicAlarms, alarms);
  publishBroadcast({ set_alarms: alarms });
}

// ── Scenes ──────────────────────────────────────────────────────
// Scenes live in localStorage, and are also mirrored to the retained
// `P/scenes` topic so every client — this app on your phone and laptop, and
// any other client — converges on the same library.
//
// Sync rules, chosen so no device can wipe another's work:
//   • merge by `id`, keeping whichever copy has the newer `updated`
//   • deletions travel as tombstones, since a scene simply missing from a
//     remote list means "that device hasn't seen it yet", not "delete it"
//   • tombstones are capped, oldest dropped first
const SCENE_TOMBSTONE_CAP = 50;

function loadScenes() {
  try {
    const s = JSON.parse(localStorage.getItem("ll_scenes") || "[]");
    return Array.isArray(s) ? s.filter(x => x && typeof x === "object") : [];
  } catch(e) { return []; }
}

function saveScenes(scenes) {
  localStorage.setItem("ll_scenes", JSON.stringify(scenes));
}

function loadTombstones() {
  try {
    const t = JSON.parse(localStorage.getItem("ll_scenes_deleted") || "[]");
    return Array.isArray(t) ? t.filter(x => typeof x === "string") : [];
  } catch(e) { return []; }
}

function saveTombstones(ids) {
  localStorage.setItem("ll_scenes_deleted",
    JSON.stringify(ids.slice(-SCENE_TOMBSTONE_CAP)));
}

function newSceneId() {
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
}

// Give legacy scenes an identity so they can participate in sync
function ensureSceneIds(scenes) {
  let changed = false;
  scenes.forEach(s => {
    if (typeof s.id !== "string")      { s.id = newSceneId();  changed = true; }
    if (typeof s.updated !== "number") { s.updated = Date.now(); changed = true; }
  });
  return changed;
}

function publishScenes() {
  publishRetained(topicScenes, {
    v: 1, from: BOARD_ID,
    scenes: loadScenes(),
    deleted: loadTombstones(),
  });
}

// Merge a remote library into ours. Returns true if our copy changed.
function mergeScenes(remote) {
  if (!remote || typeof remote !== "object") return false;
  const incoming = Array.isArray(remote.scenes) ? remote.scenes : [];
  const remoteDead = Array.isArray(remote.deleted) ? remote.deleted : [];

  const dead = new Set([...loadTombstones(), ...remoteDead.filter(x => typeof x === "string")]);
  const byId = new Map();
  loadScenes().forEach(s => { if (typeof s.id === "string") byId.set(s.id, s); });

  let changed = false;
  incoming.forEach(s => {
    if (!s || typeof s !== "object" || typeof s.id !== "string") return;
    if (dead.has(s.id)) return;                       // deleted somewhere
    const mine = byId.get(s.id);
    const theirs = typeof s.updated === "number" ? s.updated : 0;
    if (!mine || theirs > (mine.updated || 0)) {
      byId.set(s.id, s);
      changed = true;
    }
  });

  // Apply tombstones — ours and theirs
  for (const id of byId.keys()) {
    if (dead.has(id)) { byId.delete(id); changed = true; }
  }

  const mergedDead = [...dead];
  if (mergedDead.length !== loadTombstones().length) changed = true;

  if (changed) {
    saveScenes([...byId.values()]);
    saveTombstones(mergedDead);
  }
  return changed;
}

// ── Scenes (unified — built-ins + user-saved) ─────────────────────────
const BUILTIN_SCENES = [];

// Migrate legacy ll_presets into ll_scenes once
(function migrateLegacyPresets() {
  try {
    const old = JSON.parse(localStorage.getItem("ll_presets") || "[]");
    if (!old.length) return;
    const existing = JSON.parse(localStorage.getItem("ll_scenes") || "[]");
    const merged = [...existing, ...old];
    localStorage.setItem("ll_scenes", JSON.stringify(merged));
    localStorage.removeItem("ll_presets");
  } catch(e) {}
})();

function swatchRGB(pos) {
  // Vivid palette colour for dot previews — skip warm-white blend so dots are readable
  if (pos < 0.05) return [255, 210, 140]; // warm white → show as warm amber
  const n = PALETTE.length;
  const scaled = Math.min(pos, 0.9999) * (n - 1);
  const idx = Math.floor(scaled), frac = scaled - idx;
  const c1 = PALETTE[idx], c2 = PALETTE[Math.min(idx + 1, n - 1)];
  return [0,1,2].map(i => Math.round(lerp(c1[i], c2[i], frac)));
}

function _sceneSwatches(item) {
  const positions = item.groupPositions || (item.groups ? item.groups.map(g => g.pos) : []);
  if (!positions.length) return "";
  return `<div class="scene-swatches">${positions.map(pos => {
    const [r,g,b] = swatchRGB(pos);
    return `<div class="scene-dot" style="background:rgb(${r},${g},${b})"></div>`;
  }).join("")}</div>`;
}


function captureScene(name) {
  return {
    id: newSceneId(), updated: Date.now(),   // identity, for cross-device sync
    name,
    groups: getGroups(), boundaries: Array.from(boundaries),
    groupPositions: [...groupPositions], groupWLevels: [...groupWLevels],
    brightness, fadeSteps,
    on: powered,
  };
}


function _applySceneOrBuiltin(item, btn) {
  try {
    if (item.groupPositions) groupPositions = [...item.groupPositions];
    if (item.groupWLevels)   groupWLevels   = [...item.groupWLevels];
    if (item.boundaries)     { boundaries.clear(); item.boundaries.forEach(b => boundaries.add(b)); }
    if (item.brightness  !== undefined) brightness  = item.brightness;
    if (item.fadeSteps   !== undefined) fadeSteps   = item.fadeSteps;
    // Loading a scene always turns the lights on unless the scene explicitly stores on:false
    if (item.on === false) powered = false;
    else powered = true;
    syncBrightnessSlider(); syncFadeSlider(); updatePowerBtn();
    renderAll();
    publishState();
    // Visual confirmation on the button
    if (btn) { const orig = btn.textContent; btn.textContent = "✓"; setTimeout(() => { btn.textContent = orig; }, 1000); }
    if (!client || !client.connected) showToast("Loaded locally — not connected to MQTT");
  } catch(e) {
    showToast("Error loading scene: " + e.message);
    console.error(e);
  }
}

function renderScenes() {
  const container = document.getElementById("scenes-list");
  const userScenes = loadScenes();
  const all = [
    ...BUILTIN_SCENES.map(s => ({ item: s, builtin: true })),
    ...userScenes.map((s, i) => ({ item: s, builtin: false, idx: i })),
  ];
  container.innerHTML = "";
  if (!all.length) {
    container.innerHTML = `<div class="no-scenes">No scenes yet — set some colours and save one below</div>`;
    return;
  }
  all.forEach(({ item, builtin, idx }) => {
    const row = document.createElement("div");
    row.className = "scene-row";
    row.innerHTML = `
      ${_sceneSwatches(item)}
      <span class="scene-name">${item.name}</span>
      <button class="scene-load">Load</button>
      ${builtin ? "" : `<button class="scene-del">✕</button>`}`;
    row.querySelector(".scene-load").addEventListener("click", e => _applySceneOrBuiltin(item, e.currentTarget));
    if (!builtin) {
      row.querySelector(".scene-del").addEventListener("click", () => {
        const s = loadScenes();
        const [gone] = s.splice(idx, 1);
        saveScenes(s);
        // Tombstone, so the deletion propagates instead of other devices
        // helpfully syncing the scene straight back
        if (gone && typeof gone.id === "string") {
          saveTombstones([...loadTombstones(), gone.id]);
        }
        renderScenes();
        publishScenes();
      });
    }
    container.appendChild(row);
  });
}

document.getElementById("btn-save-scene").addEventListener("click", () => {
  const name = document.getElementById("scene-name").value.trim() || "Scene " + (loadScenes().length + 1);
  const scenes = loadScenes();
  scenes.push(captureScene(name));
  saveScenes(scenes);
  document.getElementById("scene-name").value = "";
  renderScenes();
  publishScenes();
});

// Cache the shell + mqtt.js so a CDN outage can't take the app down.
// Wrapped in a guard: a service-worker failure must never break the UI.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(e =>
      console.warn("[sw] registration failed (app still works)", e));
  });
}

// ── Init ──────────────────────────────────────────────────────
// Legacy scenes predate sync and have no id/updated — give them one so they
// can take part rather than being silently ignored by the merge.
(function migrateSceneIds() {
  const s = loadScenes();
  if (ensureSceneIds(s)) saveScenes(s);
})();

initGroups(cfg.numGroups);
renderAll();
renderScenes();
renderAlarms();
updatePills();
updateTargetBtns();
updatePowerBtn();
syncBrightnessSlider();
syncFadeSlider();
connect();
</script>
